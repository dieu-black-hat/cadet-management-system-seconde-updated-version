{% if policy %}<div class="legend" aria-label="Grading legend">{% for b in policy.bands.all %}<span class="grade" style="--grade: {{ b.color }}"><span class="ribbon" aria-hidden="true"><span class="r-edge"></span><span class="r-gap"></span><span class="r-core"></span><span class="r-gap"></span><span class="r-edge"></span></span><span><i class="bi {{ b.icon }}" style="color: {{ b.color }}" aria-hidden="true"></i> {{ b.label }} <span class="text-muted">{{ b.min_score }}–{{ b.max_score }}</span></span></span>{% endfor %}<a class="small" href="{% url 'discipline:policy_detail' policy.pk %}">Policy v{{ policy.version }}</a></div>{% endif %}
