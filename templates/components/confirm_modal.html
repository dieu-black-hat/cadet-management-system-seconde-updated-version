<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h2 class="modal-title h5" id="confirmModalTitle">Please confirm</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cancel"></button></div>
      <div class="modal-body"><p class="mb-0" data-confirm-text></p></div>
      <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" data-confirm-ok>Confirm</button></div>
    </div>
  </div>
</div>
